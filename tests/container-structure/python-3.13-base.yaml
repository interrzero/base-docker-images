schemaVersion: 2.0.0

# Test Python base image functionality
commandTests:
  # Pinned to the minor version. A bare "Python 3." passes on any 3.x image,
  # so it would not notice this image silently becoming a different release.
  - name: "Python is 3.13"
    command: "python3"
    args: ["--version"]
    expectedOutput: ["Python 3\\.13\\."]

  - name: "User is nonroot"
    command: "whoami"
    expectedOutput: ["nonroot"]

  - name: "Pip is available"
    command: "pip3"
    args: ["--version"]
    expectedOutput: ["pip"]

fileExistenceTests:
  - name: "Version file exists"
    path: "/tmp/versions.txt"
    shouldExist: true

fileContentTests:
  - name: "Version file contains Python version"
    path: "/tmp/versions.txt"
    expectedContents: ["python=3."]

  - name: "Version file contains major tag"
    path: "/tmp/versions.txt"
    expectedContents: ["python_major_tag=3"]

metadataTest:
  user: "nonroot"
