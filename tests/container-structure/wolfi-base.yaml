schemaVersion: 2.0.0

# Test Wolfi base image functionality
commandTests:
  - name: "Alpine package manager available"
    command: "apk"
    args: ["--version"]
    expectedOutput: ["apk-tools"]

  - name: "User is nonroot"
    command: "id"
    args: ["-un"]
    expectedOutput: ["nonroot"]

  - name: "Shell is available"
    command: "sh"
    args: ["-c", "echo 'test'"]
    expectedOutput: ["test"]

fileExistenceTests:
  - name: "Package manager exists"
    path: "/sbin/apk"
    shouldExist: true

  - name: "Basic shell exists"
    path: "/bin/sh"
    shouldExist: true

  # Every image in the fleet ships this. The release pipeline extracts it into
  # the release notes, and an image without one is silently omitted from them -
  # which is exactly how this image went unreported.
  - name: "Version file exists"
    path: "/tmp/versions.txt"
    shouldExist: true

fileContentTests:
  - name: "Version file identifies the base"
    path: "/tmp/versions.txt"
    expectedContents: ["base=wolfi"]

  - name: "Version file records the packages consumers inherit"
    path: "/tmp/versions.txt"
    expectedContents: ["glibc=", "busybox=", "zlib="]

metadataTest:
  user: "nonroot"
