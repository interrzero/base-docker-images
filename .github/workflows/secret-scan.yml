# .github/workflows/secret-scan.yml
name: Secret Scan

# Deliberately NOT part of workflow-security-scan.yml, and deliberately not
# path-filtered.
#
# GitHub applies `paths` at workflow level, not per job, so a secret-scanning
# job added to that workflow would inherit its '.github/**' filter. Measured on
# the eight most recently merged pull requests, four touched no file under
# .github at all, so a credential committed in a Dockerfile, a script or a
# dependency bump would never have been scanned while the check still reported
# green. A scanner that does not run is worse than no scanner, because it
# reads as assurance.
#
# Two scopes, for the same reason the zizmor workflow has two tracks:
#
#   pull_request / push - the action scans the diff range for that event.
#                         Fast, and blocks a secret on the way in.
#
#   schedule / dispatch - the action scans the FULL history (it sets an empty
#                         base and head for these events). A credential
#                         committed before this workflow existed is still live,
#                         and nothing in a diff scan would ever surface it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays 12:00 UTC, an hour after the workflow security audit.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Safe to cancel: a newer commit's scan supersedes the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # audit, not block, and this one is load-bearing. TruffleHog's
          # --only-verified works by calling each candidate credential's own
          # provider API to test whether it is live. Those endpoints are
          # whatever the credential belongs to - a cloud, a SaaS, a registry -
          # and cannot be enumerated in an allowlist ahead of time. Under
          # egress-policy: block the verification calls fail, nothing verifies,
          # and the scan reports clean no matter what the repository contains.
          #
          # disable-telemetry is therefore NOT set here: the action's own
          # action.yml states it "can only be set to true when egress-policy is
          # set to block", so setting it alongside audit would be inert.
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for the scheduled full-history scan. The default shallow
          # checkout gives the scanner a single commit, which it would scan
          # successfully and report clean - indistinguishable from a repository
          # that genuinely has no secrets in its history.
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          # The action is pinned by SHA, but it pulls the scanner image at
          # runtime and defaults that to :latest, so without this the binary
          # doing the actual scanning floats while everything around it is
          # pinned. Kept current by Renovate, as the zizmor pin is.
          # renovate: datasource=github-releases depName=trufflesecurity/trufflehog
          version: 3.99.0
          # --only-verified reports a credential only once it has been
          # confirmed live, which is what makes this safe to block on. The
          # action already passes --fail, so a verified finding fails the job.
          #
          # If this ever fires, rotate the credential first. Do not add an
          # exclusion to make the build green: the finding means the secret is
          # live right now, and removing the commit does not revoke it.
          extra_args: --only-verified
