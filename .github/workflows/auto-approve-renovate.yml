name: Auto-approve Renovate PRs

# pull_request rather than pull_request_target: Renovate opens its PRs from
# in-repo branches (renovate/*), never forks, so the workflow's own token gets
# the pull-requests: write this job asks for without handing it to untrusted
# fork code. A fork PR that somehow reached this workflow would get a read-only
# token, so it fails closed instead of auto-approving.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Re-running on a newer commit supersedes the earlier approval, so cancelling
# an in-flight run is safe here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # gh resolves the repository through the API
      pull-requests: write  # submit the APPROVE review on Renovate PRs
    # Gate on the author's immutable numeric id, not github.actor. actor is
    # whoever triggered the event - a synchronize can be a different account -
    # and a login string can be freed up and re-registered. 29139614 is the
    # renovate[bot] app user.
    if: github.event.pull_request.user.id == 29139614
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      # Approve with the workflow's own token, not an owner PAT, so no personal
      # credential is exposed to this job. The approval comes from
      # github-actions[bot], which does NOT satisfy main's required code-owner
      # review (CODEOWNERS: * @devopsmatt): Renovate PRs still need the owner's
      # approval or merge, and this bot approval is informational only.
      # Requires the repository setting that lets GitHub Actions approve pull
      # requests.
      - name: Auto-approve Renovate PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review "$PR_URL" --approve --body "Auto-approved by workflow"
