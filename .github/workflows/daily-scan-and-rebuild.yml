# .github/workflows/daily-scan-rebuild.yml
name: Vulnerability Scan and Rebuild

on:
  schedule:
    # Runs daily at 10:00 UTC (5 AM EST / 6 AM EDT)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if within cooldown period'
        required: false
        default: false
        type: boolean
      ignore_cooldown:
        description: 'Ignore cooldown period (for emergencies)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  GH_REPO: ${{ github.repository }}
  TRIGGER_SEVERITIES: "CRITICAL,HIGH,MEDIUM"
  # Cooldown periods in hours - don't rebuild if last release was within this time
  REBUILD_COOLDOWN_HOURS: "24"  # 1 day (daily rebuilds for both language and non-language)
  CRITICAL_COOLDOWN_HOURS: "0"  # No cooldown for CRITICAL vulnerabilities

# Least privilege by default: the workflow grants nothing, and the single job
# below widens only what it needs. Without this the run inherits the
# repository default token permissions.
permissions: {}

# Never cancel: an interrupted run can push some rebuild tags and skip others,
# leaving the cooldown state inconsistent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan_and_rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Needed to push new tags
      packages: read     # Needed to pull images and inspect manifests
      issues: write      # Open or update the publish-blocked issue for a stale image
      actions: read      # read prior run metadata when applying the rebuild cooldown
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ secrets.PAT_TOKEN }}"
          fetch-depth: 0 # Required to list tags
          # The rebuild-tag push below authenticates explicitly via
          # url.insteadOf, so the credential need not persist in the work tree.
          persist-credentials: false

      - name: Discover available base images
        id: discover_images
        run: |
          BASE_NAMES=$(find . -maxdepth 1 -name 'Dockerfile.*' -type f -printf '%f\n' | while IFS= read -r f; do echo "${f#Dockerfile.}"; done | sort -u | paste -sd ' ')
          if [ -z "$BASE_NAMES" ]; then
            echo "::error::No Dockerfiles found matching 'Dockerfile.*'"
            exit 1
          fi
          echo "Discovered image base names: $BASE_NAMES"
          echo "IMAGE_BASE_NAMES=${BASE_NAMES}" >> "$GITHUB_ENV"

      - name: Setup Docker environment
        uses: ./.github/actions/setup-docker
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Installed through the same SHA-pinned action the publish gate uses
      # rather than by piping a script fetched from a moving branch into a
      # shell. The previous step ran
      # raw.githubusercontent.com/.../trivy/main/contrib/install.sh, so whoever
      # could change that branch could run arbitrary code in CI, and the script
      # was not pinned to the release it was installing.
      #
      # The version must stay in step with the publish gate's trivy-action
      # version input: a scan and a gate on different scanner versions produce
      # different package attributions for the same image, which made a real
      # investigation considerably harder than it needed to be.
      - name: Install Trivy scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: true

      - name: Record the Trivy version in use
        run: trivy --version

      - name: Scan images and determine rebuild requirements
        id: scan_check_rebuild
        run: |
          set -e # Exit on most errors, but parsing/scan failures handled below

          dockerfile_has_changed() {
            local image=$1
            local dockerfile="Dockerfile.$image"
            local latest_tag
            latest_tag=$(git for-each-ref --sort='-v:refname' --format '%(refname:short)' "refs/tags/release/$image" | head -n 1)

            if [ -z "$latest_tag" ]; then
              # No previous tag, so it has definitely "changed"
              return 0
            fi

            if ! git diff --quiet "$latest_tag" HEAD -- "$dockerfile"; then
              # The file has changed
              return 0
            else
              # The file has not changed
              return 1
            fi
          }

          needs_rebuild_list=""

          if [ -z "$IMAGE_BASE_NAMES" ]; then
              echo "::error::IMAGE_BASE_NAMES environment variable is not set. Discovery might have failed."
              exit 1
          fi
          echo "Processing image base names: $IMAGE_BASE_NAMES"

          # A scan that cannot run must not pass silently. Counted here and
          # asserted after every image has been processed, so one unreadable
          # image still produces a full report instead of aborting the sweep.
          scan_failures=0

          for base_name in $IMAGE_BASE_NAMES; do
            echo "=== Processing image base name: $base_name ==="
            found_fixable_vulns_for_base=false
            rebuild_reason=""

            for platform_suffix in linux-amd64 linux-arm64; do
              image_name="${base_name}-${platform_suffix}"
              full_image_tag="${REGISTRY}/${GH_REPO}/${image_name}:latest"

              echo "Checking image: $full_image_tag"

              # Check if image exists before scanning
              if ! docker manifest inspect "$full_image_tag" > /dev/null 2>&1; then
                echo "::warning::Image $full_image_tag not found in registry. Skipping scan for this platform."
                continue # Skip to next platform
              fi

              # The platform must be explicit. This runner is amd64, and Trivy
              # defaults to linux/amd64, so scanning a -linux-arm64 image
              # without this fails with "no child with platform linux/amd64 in
              # index" - the arm64 index has no amd64 child to select.
              scan_platform="$(echo "$platform_suffix" | tr '-' '/')"

              echo "Scanning $full_image_tag ($scan_platform) for vulnerabilities (severities: ${TRIGGER_SEVERITIES})"
              # Honour the same exception file as the publish gate. Without this
              # the scan reports a CVE that has no available fix and pushes a
              # rebuild tag every day that the publish gate then rejects -
              # churn that looks like activity.
              scan_log="$(mktemp)"
              if trivy image \
                --platform "$scan_platform" \
                --scanners vuln \
                --ignore-unfixed \
                --ignorefile .trivyignore.yaml \
                --exit-code 1 \
                --severity "$TRIGGER_SEVERITIES" \
                --format table \
                "$full_image_tag" > "$scan_log" 2>&1; then
                cat "$scan_log"
                echo "[OK] No fixable vulnerabilities found in $full_image_tag"
              else
                scan_exit_code=$?
                cat "$scan_log"
                # Trivy exits 1 both for findings AND for a fatal error, so the
                # exit code alone cannot tell them apart. Without this check a
                # crashed scan was reported as "fixable vulnerabilities found":
                # every arm64 image was falsely flagged daily and added to the
                # rebuild list, because the scan could not read it at all.
                if grep -q "FATAL" "$scan_log"; then
                  echo "::error::Trivy could not scan $full_image_tag - this is a scan failure, not a vulnerability"
                  scan_failures=$((scan_failures + 1))
                elif [ "$scan_exit_code" -eq 1 ]; then
                  echo "[WARN] Fixable vulnerabilities found in $full_image_tag"
                  found_fixable_vulns_for_base=true
                else
                  echo "::error::Trivy scan failed for $full_image_tag (exit code: $scan_exit_code)"
                  scan_failures=$((scan_failures + 1))
                fi
              fi
              rm -f "$scan_log"
            done # End platform loop

            # Check if we need to rebuild based on vulnerabilities + base image freshness
            if [ "$found_fixable_vulns_for_base" = true ]; then
              echo "[INFO] Vulnerabilities found for $base_name. Checking base image freshness..."
              dockerfile="Dockerfile.$base_name"
              if [ ! -f "$dockerfile" ]; then
                echo "::error::Dockerfile $dockerfile not found. Cannot check base image. Skipping rebuild trigger for $base_name."
                continue # Skip to next base_name
              fi

              # Extract base image information from Dockerfile
              from_line=$(grep -i '^FROM' "$dockerfile" | head -n 1)
              echo "Parsing FROM line: $from_line"

              # Extract image name and SHA from FROM line
              from_image_name=$(echo "$from_line" | sed -E -n 's/^FROM\s+([^@]+)@sha256:.*/\1/p')
              current_sha_with_prefix=$(echo "$from_line" | sed -E -n 's/.*(@sha256:[a-f0-9]{64}).*/\1/p')

              # Trim whitespace
              from_image_name=$(echo "$from_image_name" | xargs)

              if [ -n "$from_image_name" ] && [ -n "$current_sha_with_prefix" ]; then
                current_sha_digest="${current_sha_with_prefix#@}" # Remove the '@' prefix
                echo "Dockerfile uses base image: [$from_image_name] with SHA: [$current_sha_digest]"

                echo "Querying registry for latest digest of [$from_image_name]..."
                if latest_sha_digest=$(docker manifest inspect "$from_image_name" | jq -r 'if type == "array" then .[0].digest else (.manifests[0].digest // .config.digest // .digest) end // empty'); then
                  if [ -n "$latest_sha_digest" ]; then
                    echo "Latest digest found: [$latest_sha_digest]"
                    if [ "$current_sha_digest" != "$latest_sha_digest" ]; then
                      echo "[INFO] Base image has updates: $latest_sha_digest vs $current_sha_digest"
                      echo "Adding '$base_name' to rebuild list (vulnerabilities found + outdated base image)"
                      needs_rebuild_list="${needs_rebuild_list} ${base_name}"
                      rebuild_reason="Fixable vulnerabilities found and base image $from_image_name has updates."
                    else
                      echo "[OK] Base image [$from_image_name] is up-to-date. Skipping rebuild despite vulnerabilities."
                      rebuild_reason="Fixable vulnerabilities found, but base image $from_image_name is already up-to-date."
                    fi
                  else
                    echo "::warning::Could not extract latest digest from manifest for [$from_image_name]. Skipping rebuild."
                    rebuild_reason="Fixable vulnerabilities found, but could not determine latest base image digest."
                  fi
                else
                  echo "::warning::Failed to inspect manifest for base image [$from_image_name]. Skipping rebuild."
                  rebuild_reason="Fixable vulnerabilities found, but failed to inspect base image $from_image_name."
                fi
              else
                echo "::error::Could not parse FROM line components in $dockerfile. Line was: '$from_line'"
                rebuild_reason="Fixable vulnerabilities found, but could not parse FROM line in $dockerfile."
              fi
            else
              echo "[OK] No fixable vulnerabilities found for $base_name"
              rebuild_reason="No fixable vulnerabilities found."
            fi

            if dockerfile_has_changed "$base_name"; then
              echo "Dockerfile.$base_name has changed since its last release."
              needs_rebuild_list="${needs_rebuild_list} ${base_name}"
              rebuild_reason="Dockerfile has unreleased changes."
            fi

            echo "Decision for $base_name: $rebuild_reason"
          done # End base_name loop

          # Fail the job if any image could not be scanned. A scan that cannot
          # run tells us nothing about that image, and treating silence as
          # "clean" is how the arm64 images went unscanned while still being
          # reported on every day. Asserted after the sweep so the log still
          # shows every image before the job stops.
          if [ "$scan_failures" -ne 0 ]; then
            echo "::error::${scan_failures} image(s) could not be scanned. Their vulnerability status is UNKNOWN, not clean."
            exit 1
          fi

          # Process rebuild list
          unique_needs_rebuild=$(echo "$needs_rebuild_list" | xargs -n1 | sort -u | xargs)

          if [ -z "$unique_needs_rebuild" ]; then
            echo "[OK] No images require rebuilding based on vulnerability scans and base image freshness checks."
            echo "triggered_rebuilds=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "[INFO] Triggering rebuilds for: $unique_needs_rebuild"
          echo "triggered_rebuilds=true" >> "$GITHUB_OUTPUT"
          echo "rebuild_list=$unique_needs_rebuild" >> "$GITHUB_OUTPUT"

          # Configure git for creating tags
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for base_name in $unique_needs_rebuild; do
            echo "Creating rebuild tag for $base_name..."

            # Find latest release tag
            latest_release_tag=$(git tag --list "release/${base_name}/v*" | sort -V | tail -n 1)

            if [ -z "$latest_release_tag" ]; then
              echo "::error::Could not find any release tag matching 'release/${base_name}/v*' to base the rebuild on. Skipping rebuild trigger for $base_name."
              continue
            fi
            echo "Latest release tag found: $latest_release_tag"

            # COOLDOWN CHECK: Skip if recently rebuilt (unless force or critical)
            if [ "$INPUT_IGNORE_COOLDOWN" != "true" ]; then
              # Get the commit timestamp of the latest tag
              tag_commit=$(git rev-list -n 1 "$latest_release_tag")
              tag_timestamp=$(git show -s --format=%ct "$tag_commit")
              current_timestamp=$(date +%s)
              hours_since_last_release=$(( (current_timestamp - tag_timestamp) / 3600 ))

              cooldown_hours="${REBUILD_COOLDOWN_HOURS:-72}"

              echo "[INFO] Hours since last release for $base_name: $hours_since_last_release (cooldown: ${cooldown_hours}h)"

              if [ "$hours_since_last_release" -lt "$cooldown_hours" ]; then
                echo "[SKIP] Skipping $base_name: Within ${cooldown_hours}h cooldown period"
                echo "   Last release: $(date -d "@${tag_timestamp}" 2>/dev/null || date -r "${tag_timestamp}")"
                echo "   Next eligible: $(date -d "@$((tag_timestamp + cooldown_hours * 3600))" 2>/dev/null || date -r "$((tag_timestamp + cooldown_hours * 3600))")"
                continue
              else
                echo "[OK] $base_name passed cooldown check (${hours_since_last_release}h > ${cooldown_hours}h)"
              fi
            else
              echo "[WARN] Cooldown check skipped (ignore_cooldown=true)"
            fi

            # Extract version and create rebuild tag
            version_part="${latest_release_tag#"release/${base_name}/"}"
            if [ -z "$version_part" ]; then
              echo "::error::Could not extract version part from tag '$latest_release_tag'. Skipping rebuild for $base_name."
              continue
            fi

            # Create rebuild tag with timestamp
            timestamp=$(date +%Y%m%d%H%M%S)
            version_part_no_build="${version_part%%+*}"
            new_tag="release/${base_name}/${version_part_no_build}+rebuild.${timestamp}"

            echo "Creating and pushing rebuild tag: $new_tag"
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
            git tag "$new_tag"
            git push origin "$new_tag"
            echo "[OK] Rebuild triggered for $base_name by pushing tag $new_tag"
          done
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          INPUT_IGNORE_COOLDOWN: ${{ github.event.inputs.ignore_cooldown }}

      # Dispatching a rebuild is not the same as the rebuild landing. On
      # 2026-10-02 this job dispatched rebuilds, the publish gate rejected
      # them, and the published :latest stayed on a nine-day-old build while a
      # downstream consumer's required scan went red against it - with nothing
      # reporting that the dispatch had not taken effect.
      #
      # This re-checks the CURRENTLY published :latest, which reflects whether
      # the PREVIOUS dispatch landed. A tag pushed moments ago has not built
      # yet, so a dirty result here means something is persistently not
      # shipping, which is exactly the condition that went unnoticed.
      - name: Verify the published :latest of every image is actually clean
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REGISTRY_BASE: ghcr.io/${{ github.repository }}
          TRIGGER_SEVERITIES: ${{ env.TRIGGER_SEVERITIES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          stale=0
          while IFS= read -r dockerfile; do
            [ -f "$dockerfile" ] || continue
            base_name="${dockerfile#./Dockerfile.}"
            for arch in amd64 arm64; do
              ref="${REGISTRY_BASE}/${base_name}-linux-${arch}:latest"
              log="$(mktemp)"
              if trivy image --platform "linux/${arch}" --scanners vuln \
                   --ignore-unfixed --ignorefile .trivyignore.yaml \
                   --exit-code 1 --severity "$TRIGGER_SEVERITIES" \
                   --format table "$ref" > "$log" 2>&1; then
                continue
              fi
              # Exit 1 means findings OR a fatal error, and the two need
              # different responses: a scan that could not read the image is
              # not evidence that the image is dirty.
              if grep -q "FATAL" "$log"; then
                echo "::warning::could not scan ${ref}; not treating as stale"
                cat "$log"
                continue
              fi
              echo "::error::published ${ref} still has fixable MEDIUM+ findings"
              cat "$log"
              stale=$((stale + 1))
              ./scripts/publish-failure-issue.sh open "$base_name" "$RUN_URL" || true
              break
            done
          done < <(find . -maxdepth 1 -name 'Dockerfile.*' ! -name 'deprecated.Dockerfile.*')

          if [ "$stale" -ne 0 ]; then
            echo "::error::${stale} image(s) are publishing a :latest that does not pass the gate."
            exit 1
          fi
          echo "[OK] every published :latest passes the gate"

