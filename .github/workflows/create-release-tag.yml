name: Create Release Tag

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; only the tag-pushing job widens contents.
permissions:
  contents: read

# Never cancel: tag creation is not safe to interrupt part-way, and a cancelled
# run can leave some images tagged and others not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect_changed_images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images_matrix: ${{ steps.build_matrix.outputs.images_to_build }}
      has_changes: ${{ steps.build_matrix.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ secrets.PAT_TOKEN }}"
          fetch-depth: 0
          # Tag pushes below authenticate explicitly via url.insteadOf, so the
          # checkout credential does not need to persist into the work tree.
          persist-credentials: false

      - name: Detect images whose build inputs changed
        id: build_matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # An image used to be tagged only when its own Dockerfile changed.
          # That misses the common case: a Dockerfile COPYs a script, the script
          # is fixed, the image content changes, the Dockerfile does not - so no
          # tag was cut and the fix never shipped. That happened for real with
          # the pip BOM reconcile, which sat unpublished until someone built by
          # hand while a downstream consumer's required scans stayed red against
          # the stale image.
          #
          # scripts/image-build-inputs.sh derives each image's inputs FROM its
          # Dockerfile (every local COPY/ADD source) plus its structure test
          # config, and treats shared gate inputs as affecting every image.
          # Deriving beats a hand-kept list: a new COPY is covered the day it is
          # added, with nobody having to remember.
          # On a pull request the question is "what does THIS PR touch", not
          # "what differs from each image's last release". Comparing against
          # release tags is correct for a push to main, but on a PR it reports
          # almost every image as changed, because main has moved since those
          # tags were cut. That inflated a one-Dockerfile PR to a nine-image
          # matrix, and nine concurrent jobs then tripped a Docker Hub rate
          # limit and failed the whole PR. Scope it to the PR's own diff.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pr_images=()
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              while IFS= read -r image; do
                [ -n "$image" ] || continue
                case " ${pr_images[*]-} " in *" $image "*) continue;; esac
                pr_images+=("$image")
              done < <(./scripts/image-build-inputs.sh owners "$path")
            done < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")

            if [ ${#pr_images[@]} -eq 0 ]; then
              echo "No image build inputs changed in this pull request."
              echo "images_to_build=[]" >> "$GITHUB_OUTPUT"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Pull request touches: ${pr_images[*]}"
            out="["
            for item in "${pr_images[@]}"; do out+="\"$item\", "; done
            echo "images_to_build=${out%, }]" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          images_to_build=()
          while IFS= read -r dockerfile; do
            [ -f "$dockerfile" ] || continue
            image_name="${dockerfile#./Dockerfile.}"
            latest_tag=$(git for-each-ref --sort='-v:refname' --format '%(refname:short)' "refs/tags/release/$image_name" | head -n 1)

            if [ -z "$latest_tag" ]; then
              echo "No tags found for $image_name, adding to build matrix."
              images_to_build+=("$image_name")
              continue
            fi

            changed_input=""
            while IFS= read -r input_path; do
              [ -n "$input_path" ] || continue
              if ! git diff --quiet "$latest_tag" HEAD -- "$input_path"; then
                changed_input="$input_path"
                break
              fi
            done < <(./scripts/image-build-inputs.sh inputs "$image_name")

            # Shared inputs decide whether ANY image may publish, so a change to
            # one has to rebuild the fleet rather than silently apply to
            # whichever image happens to build next.
            if [ -z "$changed_input" ]; then
              while IFS= read -r shared_path; do
                [ -n "$shared_path" ] || continue
                if ! git diff --quiet "$latest_tag" HEAD -- "$shared_path"; then
                  changed_input="$shared_path (shared)"
                  break
                fi
              done < <(./scripts/image-build-inputs.sh shared)
            fi

            if [ -n "$changed_input" ]; then
              echo "$image_name: $changed_input changed since $latest_tag, adding to build matrix."
              images_to_build+=("$image_name")
            fi
          done < <(find . -maxdepth 1 -name 'Dockerfile.*' ! -name 'deprecated.Dockerfile.*')

          if [ ${#images_to_build[@]} -eq 0 ]; then
            echo "No build inputs changed for any image."
            echo "images_to_build=[]" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found changed images: ${images_to_build[*]}"
            output_string="["
            for item in "${images_to_build[@]}"; do
              output_string+="\"$item\", "
            done
            output_string="${output_string%, }]"
            echo "images_to_build=$output_string" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit early if no changes
        if: steps.build_matrix.outputs.has_changes != 'true'
        run: |
          echo "No image build inputs changed in this commit, exiting."
          exit 0

  create_release_tags:
    needs: detect_changed_images
    if: needs.detect_changed_images.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes release tags
    strategy:
      fail-fast: false
      matrix:
        image_name: ${{ fromJSON(needs.detect_changed_images.outputs.images_matrix) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ secrets.PAT_TOKEN }}"
          fetch-depth: 0
          # Tag pushes below authenticate explicitly via url.insteadOf, so the
          # checkout credential does not need to persist into the work tree.
          persist-credentials: false

      - name: Display processing image
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          echo "Processing image: $IMAGE_NAME"

      - name: Find latest tag for image
        id: latest_tag
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          echo "Looking for existing tags for ${IMAGE_NAME}..."
          latest=$(git for-each-ref --sort='-v:refname' \
            --format '%(refname:short)' \
            "refs/tags/release/${IMAGE_NAME}" | head -n 1)

          if [ -n "$latest" ]; then
            # Extract semver from tag (remove 'v' prefix)
            semver=$(echo "$latest" | grep -oP 'v\d+\.\d+\.\d+' | sed 's/v//')
            echo "Found latest tag: $latest (version: $semver)"
          else
            semver="0.0.0"
            echo "No existing tags found, starting from $semver"
          fi

          echo "current_semver=$semver" >> "$GITHUB_OUTPUT"

      # Computed in shell rather than with a Docker-based action. The previous
      # step used WyriHaximus/github-action-next-semvers, whose image is pulled
      # UNAUTHENTICATED from Docker Hub and built on the runner. When the matrix
      # covered several images at once, the concurrent anonymous pulls hit Docker
      # Hub's rate limit and every job failed with
      #   429 Too Many Requests ... /v2/wyrihaximusgithubactions/next-semvers
      # which blocked an unrelated security fix from merging. This is three lines
      # of arithmetic; it does not justify a network dependency that can throttle.
      - name: Calculate next version
        id: next_version
        env:
          CURRENT_SEMVER: ${{ steps.latest_tag.outputs.current_semver }}
        run: |
          case "$CURRENT_SEMVER" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unparseable current version '$CURRENT_SEMVER'" >&2; exit 1 ;;
          esac
          major="${CURRENT_SEMVER%%.*}"
          rest="${CURRENT_SEMVER#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          # Same output names and meanings the action provided, so the steps that
          # consume them are unchanged.
          {
            echo "patch=${major}.${minor}.$((patch + 1))"
            echo "minor=${major}.$((minor + 1)).0"
            echo "major=$((major + 1)).0.0"
          } >> "$GITHUB_OUTPUT"

      - name: Display version information
        env:
          CURRENT_SEMVER: ${{ steps.latest_tag.outputs.current_semver }}
          NEXT_PATCH: ${{ steps.next_version.outputs.patch }}
          NEXT_MINOR: ${{ steps.next_version.outputs.minor }}
          NEXT_MAJOR: ${{ steps.next_version.outputs.major }}
        run: |
          echo "Current version: $CURRENT_SEMVER"
          echo "Next patch version: $NEXT_PATCH"
          echo "Next minor version: $NEXT_MINOR"
          echo "Next major version: $NEXT_MAJOR"

      - name: Create and push release tag
        if: github.event.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          IMAGE_NAME: ${{ matrix.image_name }}
          NEXT_PATCH: ${{ steps.next_version.outputs.patch }}
        run: |
          # Configure git for bot user
          git config user.email "i0-baseimages-bot@users.noreply.github.com"
          git config user.name "i0 Base Images Bot"

          # Configure git to use the token for authentication
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          # Create new tag with next patch version
          new_tag="release/${IMAGE_NAME}/v${NEXT_PATCH}"
          tag_message="Release ${IMAGE_NAME}/v${NEXT_PATCH}"

          echo "Creating tag: $new_tag"
          echo "Tag message: $tag_message"

          git tag -a "$new_tag" -m "$tag_message"
          git push origin "$new_tag"

          echo "[OK] Successfully created and pushed tag: $new_tag"
