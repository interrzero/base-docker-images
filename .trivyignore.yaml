# Trivy ignore file - narrow, evidence-backed, and expiring.
#
# POLICY: this repository publishes images with no *fixable* CVEs. An entry may
# only be added here when a fix genuinely does not exist, never to defer work on
# one that does. Every entry carries an expiry so the gate fails closed by
# itself; renewing one is a deliberate decision, not a default.

vulnerabilities:
  - id: CVE-2026-85091
    # zlib heap buffer overflow, MEDIUM. Present in all published images.
    #
    # Trivy classifies this as fixable only because Wolfi's security database
    # names a fixed version that has never been published. Verified 2026-09-14
    # against the authoritative sources:
    #
    #   packages.wolfi.dev/os/security.json  -> "1.3.3-r0: CVE-2026-85091"
    #   live apk index (apk policy zlib)     -> newest published is 1.3.2-r6
    #   zlib upstream releases               -> newest is 1.3.2; no 1.3.3 exists
    #   wolfi-dev/os commit 5c0896c          -> bumped epoch 5 to 6 and changed
    #                                           nothing else, so 1.3.2-r6 is a
    #                                           rebuild, not a patch
    #   Ubuntu                               -> vulnerable / fix deferred
    #
    # There is also no way to engineer around it. zlib cannot be removed
    # (apk-tools and wolfi-base depend on it), and pinning below the affected
    # range is worse: zlib 1.3.1-r51 reintroduces CVE-2026-27171 and Wolfi's
    # secdb flags it for this advisory anyway.
    #
    # So this is an unfixed vulnerability misclassified as fixable, not a
    # fixable one being deferred. Holding the gate closed on it blocked every
    # publish from 2026-09-12 onward, so no image could pick up any fix at all
    # while no fix for this one could arrive.
    #
    # A fixed package now EXISTS, but scanner databases have not caught up.
    #
    # Background: Wolfi's security metadata used to name 1.3.3-r0 as the fixed
    # version, which had never been published. Chainguard confirmed in
    # https://github.com/wolfi-dev/os/issues/78741 that this was deliberate -
    # they could not raise a pending-upstream-fix event for a CVE that Grype
    # would not otherwise detect, so they pointed the fixed event at a future
    # release to register awareness. Two reporters objected that it advertised a
    # remediation nobody could perform.
    #
    # On 2026-09-16 they resolved it properly. Commit 0a7c827 cut an RC from
    # upstream's develop branch carrying the actual fix:
    #
    #   version      1.3.2         -> 1.3.2.1_rc20260601
    #   source       da607da7      -> e3dc0a85 (different commit)
    #   patch        none          -> 0001-gz_write-don-t-keep-a-pointer-...
    #
    # Unlike the two preceding epoch bumps, this changes the source and applies
    # a patch. The live secdb now names 1.3.2.1_rc20260601-r0, a package that
    # exists, and an image built with "apk upgrade" installs it today.
    #
    # WHY THIS ENTRY STILL EXISTS: scanner vulnerability databases lag the feed.
    # Trivy's DB was built 2026-09-16T13:02Z, before the feed was updated around
    # 16:31Z, so it still maps the CVE to the old 1.3.3-r0 and flags an image
    # that already carries the fixed package. Grype shows the same. The
    # maintainer expects 24-48 hours for full propagation.
    #
    # So this is now a short bridge over a database lag, not an open-ended
    # exception over a missing fix. It expires 2026-09-23. Remove it as soon as
    # a scan of a freshly built image comes back clean - the
    # zlib_exception_still_valid job in daily-scan-and-rebuild.yml already
    # fails against the published index to prompt exactly that.
    #
    statement: >-
      No fixed zlib package exists. Wolfi security metadata names 1.3.3-r0;
      the newest published package is 1.3.2-r6 and upstream zlib has no 1.3.3
      release. Tracked at wolfi-dev/os#78741.
    expired_at: 2026-09-23
