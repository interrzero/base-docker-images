# Trivy ignore file - narrow, evidence-backed, and expiring.
#
# POLICY: this repository publishes images with no *fixable* CVEs. An entry may
# only be added here when a fix genuinely does not exist, never to defer work on
# one that does. Every entry carries an expiry so the gate fails closed by
# itself; renewing one is a deliberate decision, not a default.

vulnerabilities:
  - id: CVE-2026-85091
    # zlib heap buffer overflow, MEDIUM. Present in all published images.
    #
    # Trivy classifies this as fixable only because Wolfi's security database
    # names a fixed version that has never been published. Verified 2026-09-14
    # against the authoritative sources:
    #
    #   packages.wolfi.dev/os/security.json  -> "1.3.3-r0: CVE-2026-85091"
    #   live apk index (apk policy zlib)     -> newest published is 1.3.2-r6
    #   zlib upstream releases               -> newest is 1.3.2; no 1.3.3 exists
    #   wolfi-dev/os commit 5c0896c          -> bumped epoch 5 to 6 and changed
    #                                           nothing else, so 1.3.2-r6 is a
    #                                           rebuild, not a patch
    #   Ubuntu                               -> vulnerable / fix deferred
    #
    # There is also no way to engineer around it. zlib cannot be removed
    # (apk-tools and wolfi-base depend on it), and pinning below the affected
    # range is worse: zlib 1.3.1-r51 reintroduces CVE-2026-27171 and Wolfi's
    # secdb flags it for this advisory anyway.
    #
    # So this is an unfixed vulnerability misclassified as fixable, not a
    # fixable one being deferred. Holding the gate closed on it blocked every
    # publish from 2026-09-12 onward, so no image could pick up any fix at all
    # while no fix for this one could arrive.
    #
    # The phantom fixed version is DELIBERATE, not a mistake. Chainguard
    # explained why in https://github.com/wolfi-dev/os/issues/78741, which they
    # closed as completed on 2026-09-15:
    #
    #   "Normally we'd file a pending-upstream-fix event here, as there's no
    #    released version of zlib containing the fix. However, we currently
    #    can't raise such events for CVEs that Grype doesn't detect [...] we've
    #    created a fixed event against the version where it'll be addressed in
    #    the next upstream release (v1.3.3), to indicate awareness of the CVE."
    #
    # Two other reporters asked for the entry to be withdrawn on the grounds
    # that it advertises a remediation that cannot be performed. Chainguard
    # declined and closed the issue. So there is no metadata-correction path:
    # the only thing that lifts this is upstream zlib releasing 1.3.3, and
    # upstream's last release was v1.3.2 on 2026-02-17.
    #
    # Because the real trigger is an upstream release with no schedule, the
    # date below is a backstop rather than the mechanism. The
    # zlib_exception_still_valid job in daily-scan-and-rebuild.yml watches the
    # Wolfi index and the upstream release feed every day and fails the moment
    # either produces a fix, so this entry gets removed when the fix exists
    # rather than when a guessed date arrives.
    #
    # Re-verified 2026-09-15: zlib 1.3.2-r7 is published on both arches and does
    # not help - commit 81942f1 bumped the epoch and added a cpe block, leaving
    # expected-commit da607da7 untouched, so r7 is the identical upstream source
    # as r6. The cpe addition is likely the "missing metadata" the maintainer
    # referred to, which may eventually let them use pending-upstream-fix
    # instead; it has not yet.
    statement: >-
      No fixed zlib package exists. Wolfi security metadata names 1.3.3-r0;
      the newest published package is 1.3.2-r6 and upstream zlib has no 1.3.3
      release. Tracked at wolfi-dev/os#78741.
    expired_at: 2026-12-14
